<!DOCTYPE html>
<html>
<head>
    <title>WSM Content Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="chat-container">
        <header class="app-header">
            <h1>WSM Content Assistant</h1>
        </header>
        <main id="chat-window" class="chat-window">
            <div class="chat-message bot-message">
                <div class="message-content"><p>How can I help you today?</p></div>
            </div>
        </main>
        <footer class="search-footer">
            <div class="search-container">
                <input type="text" id="queryInput" placeholder="Ask about a product, document type, or keyword...">
                <button id="searchButton" aria-label="Send">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z"></path></svg>
                </button>
            </div>
        </footer>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const queryInput = document.getElementById('queryInput');
            const searchButton = document.getElementById('searchButton');
            const chatWindow = document.getElementById('chat-window');
            let chatHistory = [];

            function appendMessage(content, sender) {
                const messageContainer = document.createElement('div');
                messageContainer.classList.add('chat-message', `${sender}-message`);
                
                const messageContent = document.createElement('div');
                messageContent.classList.add('message-content');
                
                if (typeof content === 'string') {
                    messageContent.innerHTML = content;
                } else {
                    messageContent.innerHTML = content.message;
                    if (content.data && content.data.length > 0) {
                        const cardsContainer = document.createElement('div');
                        cardsContainer.classList.add('doc-cards-container');
                        cardsContainer.innerHTML = content.data.map(createDocumentCard).join('');
                        messageContent.appendChild(cardsContainer);
                    }
                }
                
                messageContainer.appendChild(messageContent);
                chatWindow.appendChild(messageContainer);
                chatWindow.scrollTop = chatWindow.scrollHeight;
                return messageContainer;
            }

            function createDocumentCard(doc) {
                // ... (your createDocumentCard function remains here)
                return '';
            }

            function performChat() {
                const message = queryInput.value.trim();
                if (!message) return;
                appendMessage(`<p>${message}</p>`, 'user');
                chatHistory.push({ role: 'user', parts: [{ text: message }] });
                queryInput.value = '';

                fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, history: chatHistory })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.job_id) {
                        const loadingIndicator = appendMessage(`<div class="loading-state"><div class="spinner"></div><span>Submitting job...</span></div>`, 'bot');
                        pollForResult(data.job_id, loadingIndicator);
                    } else { throw new Error('Failed to create job.'); }
                })
                .catch(error => {
                    console.error('Error:', error);
                    appendMessage(`<p class="error">Could not submit request.</p>`, 'bot');
                });
            }

            function pollForResult(jobId, loadingElement) {
                const loadingStateDiv = loadingElement.querySelector('.loading-state span');

                const interval = setInterval(() => {
                    fetch(`/result/${jobId}`)
                        .then(response => response.json())
                        .then(data => {
                            if (data.status === 'finished') {
                                clearInterval(interval);
                                chatWindow.removeChild(loadingElement);
                                const result = data.result;
                                if (result.error) {
                                    appendMessage(`<p class="error">${result.error}</p>`, 'bot');
                                } else {
                                    let botResponseContent;
                                    if (result.type === 'documents') {
                                        botResponseContent = { message: `<p>${result.message}</p>`, data: result.data };
                                        chatHistory.push({ role: 'model', parts: [{ text: result.message }] });
                                    } else {
                                        botResponseContent = `<p>${result.message}</p>`;
                                        chatHistory.push({ role: 'model', parts: [{ text: result.message }] });
                                    }
                                    appendMessage(botResponseContent, 'bot');
                                }
                            } else if (data.status === 'failed') {
                                clearInterval(interval);
                                chatWindow.removeChild(loadingElement);
                                appendMessage(`<p class="error">The request failed to process.</p>`, 'bot');
                            } else if (data.status === 'pending' && data.progress) {
                                loadingStateDiv.textContent = data.progress;
                            }
                        })
                        .catch(error => {
                            clearInterval(interval);
                            chatWindow.removeChild(loadingElement);
                            console.error('Error polling:', error);
                            appendMessage(`<p class="error">Error checking status.</p>`, 'bot');
                        });
                }, 2500); // Poll every 2.5 seconds
            }

            queryInput.addEventListener('keydown', e => e.key === 'Enter' && performChat());
            searchButton.addEventListener('click', performChat);
        });
    </script>
</body>
</html>
