<!DOCTYPE html>
<html>
<head>
    <title>WSM Content Librarian</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="chat-container">
        <header class="app-header">
            <!-- UPDATED: Changed title -->
            <h1>WSM Content Librarian</h1>
        </header>
        <main id="chat-window" class="chat-window">
            <div class="chat-message bot-message">
                <div class="message-content"><p>How can I help you today?</p></div>
            </div>
        </main>
        <footer class="search-footer">
            <div class="search-container">
                <input type="text" id="queryInput" placeholder="Ask about a product, document type, or keyword...">
                <button id="searchButton" aria-label="Send">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z"></path></svg>
                </button>
            </div>
        </footer>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const queryInput = document.getElementById('queryInput');
            const searchButton = document.getElementById('searchButton');
            const chatWindow = document.getElementById('chat-window');
            let chatHistory = [];

            function appendMessage(content, sender) {
                const messageContainer = document.createElement('div');
                messageContainer.classList.add('chat-message', `${sender}-message`);
                
                const messageContent = document.createElement('div');
                messageContent.classList.add('message-content');
                
                if (typeof content === 'string') {
                    messageContent.innerHTML = content;
                } else {
                    messageContent.innerHTML = `<p>${content.message}</p>`;
                    if (content.data && content.data.length > 0) {
                        const cardsContainer = document.createElement('div');
                        cardsContainer.classList.add('doc-cards-container');
                        cardsContainer.innerHTML = content.data.map(createDocumentCard).join('');
                        messageContent.appendChild(cardsContainer);
                    }
                }
                
                messageContainer.appendChild(messageContent);
                chatWindow.appendChild(messageContainer);
                chatWindow.scrollTop = chatWindow.scrollHeight;
                return messageContainer;
            }

            function createDocumentCard(doc) {
                const docTypeHTML = doc.Doc_type ? `<span class="tag tag-blue">${doc.Doc_type}</span>` : '';
                const productHTML = doc.Product ? `<span class="tag tag-gray">${doc.Product}</span>` : '';
                const contextId = `context-${Date.now()}-${Math.random()}`;
                return `<div class="doc-card">
                            <div class="card-header"><h3>${doc.Content_Title || 'Untitled'}</h3><div class="tags">${productHTML}${docTypeHTML}</div></div>
                            <div class="card-body"><p>${doc.Description || 'No description.'}</p></div>
                            <div class="card-footer">
                                <a href="${doc.Link}" target="_blank" class="button-secondary">View Document</a>
                                <button class="button-primary summarize-btn" data-url="${doc.Link}" onclick="getSummary(this, '${contextId}')">Summarize</button>
                            </div>
                            <div class="context-wrapper" id="${contextId}"></div>
                        </div>`;
            }

            function performChat() {
                const message = queryInput.value.trim();
                if (!message) return;
                appendMessage(`<p>${message}</p>`, 'user');
                chatHistory.push({ role: 'user', parts: [{ text: message }] });
                queryInput.value = '';

                fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, history: chatHistory })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.job_id) {
                        // UPDATED: Changed loading text
                        const loadingIndicator = appendMessage(`<div class="loading-state"><div class="spinner"></div><span>Processing question...</span></div>`, 'bot');
                        pollForResult(data.job_id, loadingIndicator);
                    } else { throw new Error('Failed to create chat job.'); }
                })
                .catch(error => {
                    console.error('Error:', error);
                    appendMessage(`<p class="error">Could not submit request.</p>`, 'bot');
                });
            }

            function pollForResult(jobId, loadingElement) {
                const loadingStateDiv = loadingElement.querySelector('.loading-state span');

                const interval = setInterval(() => {
                    fetch(`/result/${jobId}`)
                        .then(response => response.json())
                        .then(data => {
                            if (data.status === 'finished') {
                                clearInterval(interval);
                                chatWindow.removeChild(loadingElement);
                                const result = data.result;
                                if (result.error) {
                                    appendMessage(`<p class="error">${result.error}</p>`, 'bot');
                                } else {
                                    let botResponseContent;
                                    if (result.type === 'documents') {
                                        botResponseContent = { message: result.message, data: result.data };
                                        chatHistory.push({ role: 'model', parts: [{ text: result.message }] });
                                    } else {
                                        botResponseContent = `<p>${result.message}</p>`;
                                        chatHistory.push({ role: 'model', parts: [{ text: result.message }] });
                                    }
                                    appendMessage(botResponseContent, 'bot');
                                }
                            } else if (data.status === 'failed') {
                                clearInterval(interval);
                                chatWindow.removeChild(loadingElement);
                                appendMessage(`<p class="error">The request failed to process.</p>`, 'bot');
                            } else if (data.status === 'pending' && data.progress) {
                                if(loadingStateDiv) loadingStateDiv.textContent = data.progress;
                            }
                        })
                        .catch(error => {
                            clearInterval(interval);
                            chatWindow.removeChild(loadingElement);
                            console.error('Error polling:', error);
                            appendMessage(`<p class="error">Error checking status.</p>`, 'bot');
                        });
                }, 2500);
            }
            
            window.getSummary = function(button, contextId) {
                const url = button.dataset.url;
                const contextWrapper = document.getElementById(contextId);
                button.disabled = true;
                button.textContent = 'Summarizing...';
                
                const loadingIndicator = document.createElement('div');
                loadingIndicator.classList.add('loading-state');
                loadingIndicator.style.padding = '1rem 0';
                loadingIndicator.innerHTML = `<div class="spinner"></div><span>Submitting summary job...</span>`;
                contextWrapper.innerHTML = '';
                contextWrapper.appendChild(loadingIndicator);

                fetch('/summarize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.job_id) {
                        pollForSummary(data.job_id, contextWrapper, button);
                    } else {
                        throw new Error('Failed to create summary job.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    contextWrapper.innerHTML = `<div class="context-container error">Failed to start summary job.</div>`;
                    button.disabled = false;
                    button.textContent = 'Summarize';
                });
            }

            function pollForSummary(jobId, contextWrapper, button) {
                const loadingStateSpan = contextWrapper.querySelector('.loading-state span');

                const interval = setInterval(() => {
                    fetch(`/result/${jobId}`)
                        .then(response => response.json())
                        .then(data => {
                            if (data.status === 'finished') {
                                clearInterval(interval);
                                const result = data.result;
                                if (result.status === 'success') {
                                    const summaryHTML = `<div class="context-container"><strong>Summary:</strong> ${result.summary.replace(/\n/g, '<br>')}</div>`;
                                    contextWrapper.innerHTML = summaryHTML;
                                    button.style.display = 'none';
                                } else {
                                    const errorHTML = `<div class="context-container error">${result.message}</div>`;
                                    contextWrapper.innerHTML = errorHTML;
                                    button.disabled = false;
                                    button.textContent = 'Summarize';
                                }
                            } else if (data.status === 'failed') {
                                clearInterval(interval);
                                contextWrapper.innerHTML = `<div class="context-container error">The summary job failed.</div>`;
                                button.disabled = false;
                                button.textContent = 'Summarize';
                            } else if (data.status === 'pending' && data.progress) {
                                if(loadingStateSpan) loadingStateSpan.textContent = data.progress;
                            }
                        })
                        .catch(error => {
                            clearInterval(interval);
                            console.error('Error polling summary:', error);
                            contextWrapper.innerHTML = `<div class="context-container error">Error checking summary status.</div>`;
                            button.disabled = false;
                            button.textContent = 'Summarize';
                        });
                }, 2500);
            }

            queryInput.addEventListener('keydown', e => e.key === 'Enter' && performChat());
            searchButton.addEventListener('click', performChat);
        });
    </script>
</body>
</html>
