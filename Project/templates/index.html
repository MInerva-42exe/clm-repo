<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSM Content Assistant</title>
    <!-- Your CSS link or <style> block goes here -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <!-- Your HTML structure (header, main, footer) remains the same -->
        <header class="app-header"><h1>WSM Content Assistant</h1></header>
        <main id="chat-window" class="chat-window">
             <div class="chat-message bot-message">
                <div class="message-content"><p>How can I help you today?</p></div>
            </div>
        </main>
        <footer class="search-footer">
            <div class="search-container">
                <input type="text" id="queryInput" placeholder="Ask about a product, document type, or keyword...">
                <button id="searchButton" aria-label="Send">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const queryInput = document.getElementById('queryInput');
            const searchButton = document.getElementById('searchButton');
            const chatWindow = document.getElementById('chat-window');
            let chatHistory = [];

            searchButton.addEventListener('click', performChat);
            queryInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    performChat();
                }
            });

            function appendMessage(content, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('chat-message', `${sender}-message`);
                if (typeof content === 'string') {
                     messageDiv.innerHTML = `<div class="message-content">${content.replace(/\n/g, '<br>')}</div>`;
                } else {
                    messageDiv.innerHTML = `<div class="message-content">${content.message}<div class="doc-cards-container">${content.data.map(createDocumentCard).join('')}</div></div>`;
                }
                chatWindow.appendChild(messageDiv);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
            
            function createDocumentCard(doc) {
                const docTypeHTML = doc.Doc_type ? `<span class="tag tag-blue">${doc.Doc_type}</span>` : '';
                const productHTML = doc.Product ? `<span class="tag tag-gray">${doc.Product}</span>` : '';
                const contextId = `context-${Date.now()}-${Math.random()}`;
                return `<div class="doc-card">
                            <div class="card-header"><h3>${doc.Content_Title || 'Untitled'}</h3><div class="tags">${productHTML}${docTypeHTML}</div></div>
                            <div class="card-body"><p>${doc.Description || 'No description.'}</p></div>
                            <div class="card-footer">
                                <a href="${doc.Link}" target="_blank" class="button-secondary">View Document</a>
                                <button class="button-primary summarize-btn" data-url="${doc.Link}" onclick="getSummary(this, '${contextId}')">Summarize</button>
                            </div>
                            <div class="context-wrapper" id="${contextId}"></div>
                        </div>`;
            }

            function performChat() {
                const message = queryInput.value.trim();
                if (!message) return;
                appendMessage(`<p>${message}</p>`, 'user');
                chatHistory.push({ role: 'user', parts: [{ text: message }] });
                queryInput.value = '';

                const loadingIndicator = document.createElement('div');
                loadingIndicator.classList.add('chat-message', 'bot-message');
                loadingIndicator.innerHTML = `<div class="message-content"><div class="spinner"></div></div>`;
                chatWindow.appendChild(loadingIndicator);
                chatWindow.scrollTop = chatWindow.scrollHeight;

                fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, history: chatHistory })
                })
                .then(response => response.json())
                .then(response => {
                    chatWindow.removeChild(loadingIndicator);
                    if (response.error) {
                        appendMessage(`<p class="error">${response.error}</p>`, 'bot');
                        return;
                    }
                    let botResponseContent;
                    if (response.type === 'documents') {
                        botResponseContent = { message: `<p>${response.message}</p>`, data: response.data };
                        chatHistory.push({ role: 'model', parts: [{ text: response.message }] });
                    } else {
                        botResponseContent = `<p>${response.message}</p>`;
                        chatHistory.push({ role: 'model', parts: [{ text: response.message }] });
                    }
                    appendMessage(botResponseContent, 'bot');
                })
                .catch(error => {
                    chatWindow.removeChild(loadingIndicator);
                    console.error('Error:', error);
                    appendMessage(`<p class="error">An error occurred.</p>`, 'bot');
                });
            }

            // Make getSummary globally accessible
            window.getSummary = function(button, contextId) {
                const url = button.dataset.url;
                const contextWrapper = document.getElementById(contextId);
                button.disabled = true;
                button.textContent = 'Summarizing...';
                contextWrapper.innerHTML = `<div class="loading-state" style="padding: 1rem 0;"><div class="spinner"></div><span>Fetching and summarizing...</span></div>`;

                fetch('/summarize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                })
                .then(response => {
                    // Check if the response was successful (status 200-299)
                    if (!response.ok) {
                        // This will catch hard server errors (500, etc.)
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // --- NEW: Check the 'status' field in the JSON payload ---
                    if (data.status === 'success') {
                        const summaryHTML = `<div class="context-container"><strong>Summary:</strong> ${data.summary.replace(/\n/g, '<br>')}</div>`;
                        contextWrapper.innerHTML = summaryHTML;
                        button.style.display = 'none';
                    } else {
                        // Display the friendly error message from the server
                        const errorHTML = `<div class="context-container error">${data.message}</div>`;
                        contextWrapper.innerHTML = errorHTML;
                        button.disabled = false;
                        button.textContent = 'Summarize';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    const errorHTML = `<div class="context-container error">A network error occurred. Please try again.</div>`;
                    contextWrapper.innerHTML = errorHTML;
                    button.disabled = false;
                    button.textContent = 'Summarize';
                });
            }
        });
    </script>
</body>
</html>
