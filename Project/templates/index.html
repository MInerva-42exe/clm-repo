<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSM Content Repository</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>WSM Content Repository</h1>
            <p class="subtitle">Ask a question or enter keywords to find relevant documents.</p>
        </header>
        
        <div class="search-wrapper">
            <div class="search-container">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="queryInput" placeholder="e.g., 'ADMP case study' or 'security guide for Log360'">
                <button id="searchButton">Search</button>
            </div>
        </div>

        <div id="results" class="results-container">
             <div class="initial-message">
                <p>Your search results will appear here.</p>
            </div>
        </div>
    </div>

    <script>
        const queryInput = document.getElementById('queryInput');
        const searchButton = document.getElementById('searchButton');
        const resultsDiv = document.getElementById('results');

        searchButton.addEventListener('click', performSearch);
        queryInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') performSearch();
        });

        function performSearch() {
            const query = queryInput.value.trim();
            if (!query) return;

            resultsDiv.innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Searching for documents...</p>
                </div>
            `;

            fetch('/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query })
            })
            .then(response => response.json())
            .then(data => {
                resultsDiv.innerHTML = '';
                if (data.error) {
                    resultsDiv.innerHTML = `<div class="empty-state"><p class="error">Error: ${data.error}</p></div>`;
                    return;
                }
                if (data.length === 0) {
                    resultsDiv.innerHTML = `<div class="empty-state"><p>No documents found. Try a different search term.</p></div>`;
                } else {
                    data.forEach((doc, index) => {
                        const docCard = document.createElement('div');
                        docCard.classList.add('doc-card');
                        
                        const docTypeHTML = doc.Doc_type ? `<span class="tag tag-blue">${doc.Doc_type}</span>` : '';
                        const productHTML = doc.Product ? `<span class="tag tag-gray">${doc.Product}</span>` : '';

                        docCard.innerHTML = `
                            <div class="card-header">
                                <h3>${doc.Content_Title || 'Untitled Document'}</h3>
                                <div class="tags">${productHTML} ${docTypeHTML}</div>
                            </div>
                            <div class="card-body"><p>${doc.Description || 'No description available.'}</p></div>
                            <div class="card-footer">
                                <a href="${doc.Link}" target="_blank" class="button-secondary">View Document</a>
                                <button class="button-primary summarize-btn" data-url="${doc.Link}" onclick="getSummary(this, 'context-${index}')">Summarize</button>
                            </div>
                            <div class="context-wrapper" id="context-${index}"></div>
                        `;
                        resultsDiv.appendChild(docCard);
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                resultsDiv.innerHTML = `<div class="empty-state"><p class="error">An error occurred while fetching results.</p></div>`;
            });
        }

        function getSummary(button, contextId) {
            const url = button.getAttribute('data-url');
            const contextWrapper = document.getElementById(contextId);
            
            button.disabled = true;
            button.textContent = 'Summarizing...';
            contextWrapper.innerHTML = '';

            fetch('/summarize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            })
            .then(response => response.json())
            .then(data => {
                contextWrapper.innerHTML = `<div class="context-container"><strong>Context:</strong> ${data.summary}</div>`;
                button.style.display = 'none';
            })
            .catch(error => {
                console.error('Error:', error);
                contextWrapper.innerHTML = `<div class="context-container error">Failed to get summary.</div>`;
                button.disabled = false;
                button.textContent = 'Summarize';
            });
        }
    </script>
</body>
</html>
